name: Persona section pages

on:
  push:
    branches: [fix/live-persona-section-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test -- src/lib/__tests__/internalPersonaUiCoverage.test.ts
      - run: npm run build

name: Restore child payloads

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Restore verified Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          blobs = {
              "src/content/child-courses/byv.payload.ts": "6f6364bb2cb9deb22cc095f665966bb476580162",
              "src/content/child-courses/ln.payload.ts": "ad792b34cf22646a7e60b49dcd106253b2881992",
          }

          for path, sha in blobs.items():
              url = f"https://api.github.com/repos/{repo}/git/blobs/{sha}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              content = base64.b64decode(payload["content"])
              actual = hashlib.sha1(f"blob {len(content)}\0".encode() + content).hexdigest()
              if actual != sha:
                  raise SystemExit(f"Blob integrity mismatch for {path}: {actual} != {sha}")
              pathlib.Path(path).write_bytes(content)
              print(f"restored {path} -> {sha}")
          PY
      - name: Commit restored payloads when needed
        run: |
          if git diff --quiet -- src/content/child-courses/byv.payload.ts src/content/child-courses/ln.payload.ts; then
            echo "Verified payloads already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/child-courses/byv.payload.ts src/content/child-courses/ln.payload.ts
          git commit -m "fix(child): restore verified course payloads"
          git push origin HEAD:${{ github.head_ref }}

name: A1 audio validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run test -- src/lib/__tests__/deA1AudioCoverage.test.ts
